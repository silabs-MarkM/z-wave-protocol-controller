        $ref: '#/components/parameters/homeId'
      nodeId:
        $ref: '#/components/parameters/nodeId'
      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccAssociationAssociationGetCommand:
        name: ASSOCIATION_GET
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
