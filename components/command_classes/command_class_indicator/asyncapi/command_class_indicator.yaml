# Generated MQTT channels for this command class. Message examples are preserved across regeneration.
channels:
  ccIndicatorIndicatorGetCommand:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Indicator/Command/IndicatorGet
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_INDICATOR
    x-cc-dir: command_class_indicator
    x-mqtt-support: 'true'
    x-support: 'true'
    x-control: 'true'
    x-command-name: INDICATOR_GET
    parameters:
      homeId:
        $ref: '#/components/parameters/homeId'
      nodeId:
        $ref: '#/components/parameters/nodeId'
      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccIndicatorIndicatorGetCommand:
        name: INDICATOR_GET
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
              indicator_id:
                type: string
                description: Hex-encoded value as published on MQTT
        examples:
        - payload:
            indicator_id: '0x01'
  ccIndicatorIndicatorReportReport:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Indicator/Report/IndicatorReport
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_INDICATOR
    x-cc-dir: command_class_indicator
    x-mqtt-support: 'true'
    x-support: 'true'
    x-control: 'true'
    x-command-name: INDICATOR_REPORT
    parameters:
      homeId:
        $ref: '#/components/parameters/homeId'
      nodeId:
        $ref: '#/components/parameters/nodeId'
      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccIndicatorIndicatorReportReport:
        name: INDICATOR_REPORT
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
              indicator_0_value:
                type: string
                description: Hex-encoded value as published on MQTT
              properties1:
                type: object
                properties:
                  indicator_object_count:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                additionalProperties: true
              vg1:
                type: array
                items:
                  type: object
                  properties:
                    indicator_id:
                      type: string
                      description: Hex-encoded value as published on MQTT
                    property_id:
                      type: string
                      description: Hex-encoded value as published on MQTT
                    value:
                      type: string
                      description: Hex-encoded value as published on MQTT
                  additionalProperties: true
        examples:
        - payload:
            indicator_0_value: 0
            properties1:
              indicator_object_count: 1
              reserved: 0
            vg1:
            - indicator_id: 5
              property_id: 1
              value: 0
