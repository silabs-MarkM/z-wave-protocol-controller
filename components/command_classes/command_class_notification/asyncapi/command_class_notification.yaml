                  v1_alarm:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                additionalProperties: true
              bit_mask:
                type: string
                description: Hex-encoded value as published on MQTT
        examples:
        - payload:
            bit_mask:
            - 80
