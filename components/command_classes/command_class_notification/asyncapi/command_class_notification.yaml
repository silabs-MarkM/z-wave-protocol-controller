    messages:
      ccNotificationNotificationSupportedGetCommand:
        name: NOTIFICATION_SUPPORTED_GET
        payload:
          schema:
            type: object
            additionalProperties: true
            properties: {}
        examples:
        - payload: {}
  ccNotificationNotificationSupportedReportReport:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Notification/Report/NotificationSupportedReport
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_NOTIFICATION
