# Generated MQTT channels for this command class. Message examples are preserved across regeneration.
channels:
  ccNotificationNotificationGetCommand:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Notification/Command/NotificationGet
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_NOTIFICATION
    x-cc-dir: command_class_notification
    x-mqtt-support: 'true'
    x-support: 'false'
    x-control: 'true'
    x-command-name: NOTIFICATION_GET
    parameters:
      homeId:
        $ref: '#/components/parameters/homeId'
      nodeId:
        $ref: '#/components/parameters/nodeId'
      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccNotificationNotificationGetCommand:
        name: NOTIFICATION_GET
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
              v1_alarm_type:
                type: string
                description: Hex-encoded value as published on MQTT
              notification_type:
                type: string
                description: Hex-encoded value as published on MQTT
              event:
                type: string
                description: Hex-encoded value as published on MQTT
        examples:
        - payload:
            v1_alarm_type: '0x09'
            notification_type: '0xFF'
            event: '0x00'
  ccNotificationNotificationReportReport:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Notification/Report/NotificationReport
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_NOTIFICATION
    x-cc-dir: command_class_notification
    x-mqtt-support: 'true'
    x-support: 'false'
    x-control: 'true'
    x-command-name: NOTIFICATION_REPORT
    parameters:
      homeId:
        $ref: '#/components/parameters/homeId'
      nodeId:
        $ref: '#/components/parameters/nodeId'
      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccNotificationNotificationReportReport:
        name: NOTIFICATION_REPORT
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
              v1_alarm_type:
                type: string
                description: Hex-encoded value as published on MQTT
              v1_alarm_level:
                type: string
                description: Hex-encoded value as published on MQTT
              notification_status:
                type: string
                description: Hex-encoded value as published on MQTT
              notification_type:
                type: string
                description: Hex-encoded value as published on MQTT
              event:
                type: string
                description: Hex-encoded value as published on MQTT
              properties1:
                type: object
                properties:
                  event_parameters_length:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                  reserved2:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                  sequence:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                additionalProperties: true
              event_parameter:
                type: array
                items:
                  type: string
                description: Hex-encoded bytes
              sequence_number:
                type: string
                description: Hex-encoded value as published on MQTT
        examples:
        - payload:
            event: 254
            event_parameter: []
            notification_status: 0
            notification_type: 4
            properties1:
              event_parameters_length: 0
              reserved2: 0
              sequence: 0
            reserved: 0
            sequence_number: 0
            v1_alarm_level: 0
            v1_alarm_type: 0
  ccNotificationNotificationSetCommand:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Notification/Command/NotificationSet
    x-doc-group: command_class
    x-cc-name: COMMAND_CLASS_NOTIFICATION
