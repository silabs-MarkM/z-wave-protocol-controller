            notification_type: '0x01'
            notification_status: '0x01'
  ccNotificationNotificationSupportedGetCommand:
    address: zpc/{homeId}/{nodeId}/ep{endpointId}/Notification/Command/NotificationSupportedGet
    x-doc-group: command_class
