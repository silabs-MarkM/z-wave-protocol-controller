  receiveSwitchColorSwitchColorSet:
    action: receive
    title: SWITCH_COLOR_SET
    channel:
      $ref: '#/channels/ccSwitchColorSwitchColorSetCommand'
    traits:
    - $ref: '#/components/operationTraits/mqttQos0'
  receiveSwitchColorSwitchColorStartLevelChange:
    action: receive
    title: SWITCH_COLOR_START_LEVEL_CHANGE
    channel:
      $ref: '#/channels/ccSwitchColorSwitchColorStartLevelChangeCommand'
    traits:
