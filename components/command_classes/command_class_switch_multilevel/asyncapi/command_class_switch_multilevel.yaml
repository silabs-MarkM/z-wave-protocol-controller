              dimming_duration:
                type: string
                description: Hex-encoded value as published on MQTT
              step_size:
                type: string
                description: Hex-encoded value as published on MQTT
        examples:
        - payload:
            properties1:
              ignore_start_level: '0x00'
              up_down: '0x00'
              inc_dec: '0x00'
            start_level: '0x05'
            dimming_duration: '0x14'
