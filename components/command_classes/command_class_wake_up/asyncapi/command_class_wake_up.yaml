      endpointId:
        $ref: '#/components/parameters/endpointId'
    messages:
      ccWakeUpWakeUpIntervalCapabilitiesReportReport:
        name: WAKE_UP_INTERVAL_CAPABILITIES_REPORT
        payload:
          schema:
            type: object
            additionalProperties: true
            properties:
              minimum_wake_up_interval_seconds:
                type: string
                description: Hex-encoded value as published on MQTT
              maximum_wake_up_interval_seconds:
                type: string
                description: Hex-encoded value as published on MQTT
              default_wake_up_interval_seconds:
                type: string
                description: Hex-encoded value as published on MQTT
              wake_up_interval_step_seconds:
                type: string
                description: Hex-encoded value as published on MQTT
              properties1:
                type: object
                properties:
                  wake_up_on_demand:
                    type: string
                    description: Hex-encoded byte (e.g. 0x05)
                additionalProperties: true
        examples:
        - payload:
            default_wake_up_interval_seconds: 60
            maximum_wake_up_interval_seconds: 100000
            minimum_wake_up_interval_seconds: 5
            properties1:
              reserved: 0
              wake_up_on_demand: 0
            wake_up_interval_step_seconds: 1
