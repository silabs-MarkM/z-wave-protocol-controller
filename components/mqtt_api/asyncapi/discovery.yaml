x-doc-group: discovery
x-doc-title: Discovery MQTT API
x-doc-preamble: |
  The Discovery API allows clients to obtain the Z-Wave Home ID of the controller.
  This is a global topic (not scoped by home ID) because the Home ID is unknown until after discovery.
x-doc-appendix: |
  ## Example

  ```bash
  # Request Home ID
  mosquitto_pub -t "zpc/Discovery" -m '{}'

  # Subscribe to receive the report
  mosquitto_sub -t "zpc/Discovery/Report" -v
  ```
channels:
  discovery:
    address: zpc/Discovery
    x-doc-group: discovery
    description: Request the current Home ID (publish any payload, e.g. `{}`).
    messages:
      discoveryCommand:
        name: Discovery command
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  discoveryReport:
    address: zpc/Discovery/Report
    x-doc-group: discovery
    description: Response with the eight-character hexadecimal Home ID.
    messages:
      discoveryReport:
        name: Discovery report
        payload:
          schema:
            type: object
            properties:
              home_id:
                type: string
                description: Eight-character hexadecimal Z-Wave Home ID
            additionalProperties: true
            example:
              home_id: CAFECAFE
        examples:
          - payload:
              home_id: E30FC2EC
operations:
  receiveDiscovery:
    action: receive
    title: DISCOVERY
    description: Publish any message (e.g. empty JSON `{}`) to request the current Home ID.
    channel:
      $ref: "#/channels/discovery"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendDiscoveryReport:
    action: send
    title: DISCOVERY_REPORT
    description: |
      The `home_id` is the 8-character hexadecimal representation of the Z-Wave Home ID.
      Use this value to construct network-scoped topics `zpc/<home_id>/...`.
    channel:
      $ref: "#/channels/discoveryReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
