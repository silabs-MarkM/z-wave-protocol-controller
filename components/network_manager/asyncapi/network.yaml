x-doc-group: network
x-doc-title: Network Management MQTT API
x-doc-preamble: |
  Add/remove nodes, accept DSK, grant keys, list devices, factory reset, and
  Network Layer Security (NLS) operations.

  Breaking change: node inventory topics use `Network/Node/List` and
  `Network/Node/Properties` (not Device-prefixed names).
channels:
  networkNodeAdd:
    address: zpc/{homeId}/Network/Node/Add
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkNodeAddReport:
    address: zpc/{homeId}/Network/Node/Add/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nodeAddReport:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
              dsk:
                type: string
              status:
                type: string
              reason:
                description: Present on failure (string or 6404 number)
              activity:
                type: string
            additionalProperties: true
        examples:
          - payload:
              dsk: 51033-12056-08663-56209-06095-04862-35970-18051
              node_id: 2
              status: success
  networkNodeAddAbort:
    address: zpc/{homeId}/Network/Node/Add/Abort
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkNodeRemove:
    address: zpc/{homeId}/Network/Node/Remove
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkNodeRemoveReport:
    address: zpc/{homeId}/Network/Node/Remove/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nodeRemoveReport:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
              dsk:
                type: string
              status:
                type: string
              reason:
                type: string
              activity:
                type: string
            additionalProperties: true
        examples:
          - payload:
              dsk: 51535-47759-51469-29800-42275-26962-49601-57742
              node_id: 11
              status: success
  networkNodeRemoveFailed:
    address: zpc/{homeId}/Network/Node/RemoveFailed
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      removeFailed:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
            additionalProperties: true
            example:
              node_id: 2
        examples:
          - payload:
              node_id: 2
  networkNodeRemoveFailedReport:
    address: zpc/{homeId}/Network/Node/RemoveFailed/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      removeFailedReport:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
              status:
                type: string
              reason:
                type: string
            additionalProperties: true
        examples:
          - payload:
              node_id: 10
              reason: operation_successful
              status: ok
  networkNodeRemoveAbort:
    address: zpc/{homeId}/Network/Node/Remove/Abort
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkDskAccept:
    address: zpc/{homeId}/Network/DSK/Accept
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      dskAccept:
        payload:
          schema:
            type: object
            properties:
              dsk:
                type: string
            additionalProperties: true
        examples:
          - payload:
              dsk: 51033-12056-08663-56209-06095-04862-35970-18051
  networkRequestedKeysReport:
    address: zpc/{homeId}/Network/RequestedKeys/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      requestedKeys:
        payload:
          schema:
            type: object
            properties:
              Keys:
                type: string
              CSA:
                type: boolean
            additionalProperties: true
            example:
              Keys: "0x7"
              CSA: false
        examples:
          - payload:
              CSA: false
              Keys: '0x87'
  networkGrantKeys:
    address: zpc/{homeId}/Network/GrantKeys
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      grantKeys:
        payload:
          schema:
            type: object
            properties:
              Accept:
                type: boolean
              Keys:
                description: Keys bitmask (number or string)
              CSA:
                type: boolean
            additionalProperties: true
            example:
              Accept: true
              Keys: 7
              CSA: false
        examples:
          - payload:
              Accept: true
              Keys: '0x87'
              CSA: false
  networkRequestedDskReport:
    address: zpc/{homeId}/Network/RequestedDSK/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      requestedDsk:
        payload:
          schema:
            type: object
            properties:
              DSK:
                type: string
            additionalProperties: true
        examples:
          - payload:
              DSK: xxxxx-12056-08663-56209-06095-04862-35970-18051
  networkNodeList:
    address: zpc/{homeId}/Network/Node/List
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkNodeListReport:
    address: zpc/{homeId}/Network/Node/List/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nodeListReport:
        payload:
          schema:
            type: array
            items:
              type: object
              additionalProperties: true
        examples:
          - payload:
            - node_information:
                basic_device_class: 2
                command_class_list:
                - 94
                - 86
                - 116
                - 152
                - 159
                - 85
                generic_device_class: 1
                granted_keys: 135
                inclusion_protocol: 0
                listening_protocol: 211
                node_id: 2
                optional_protocol: 150
                s0_command_class_list: []
                s2_command_class_list: []
                specific_device_class: 0
              version_report:
                firmware_0_sub_version: null
                firmware_0_version: null
                hardware_version: null
                number_of_firmware_targets: null
                z_wave_library_type: null
                z_wave_protocol_sub_version: null
                z_wave_protocol_version: null
            - node_information:
                basic_device_class: 4
                command_class_list:
                - 94
                - 159
                - 152
                - 108
                - 85
                generic_device_class: 119
                granted_keys: 129
                inclusion_protocol: 0
                listening_protocol: 211
                node_id: 4
                optional_protocol: 156
                s0_command_class_list: []
                s2_command_class_list:
                - 134
                - 133
                - 89
                - 192
                - 114
                specific_device_class: 0
              version_report:
                firmware_0_sub_version: 224
                firmware_0_version: 183
                hardware_version: 169
                number_of_firmware_targets: 0
                z_wave_library_type: 3
                z_wave_protocol_sub_version: 80
                z_wave_protocol_version: 7
  networkNodeProperties:
    address: zpc/{homeId}/Network/Node/Properties
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nodeProperties:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
            additionalProperties: true
            example:
              node_id: 2
        examples:
          - payload:
              node_id: 2
  networkNodePropertiesReport:
    address: zpc/{homeId}/Network/Node/Properties/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nodePropertiesReport:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload:
              granted_keys: 0
              inclusion_protocol: 0
              last_number_of_repeaters: 0
              last_routing_path:
              - 0
              - 0
              - 0
              - 0
              last_rx_rssi: null
              last_rx_tx_timestamp: 1789339102
              last_tx_power: 127
              last_tx_ticks: 1
              network_status: unknown
              node_id: 2
              s2_capability: true
  networkNodeInterview:
    address: zpc/{homeId}/Network/Node/Interview
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      interview:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
            additionalProperties: true
            example:
              node_id: 2
        examples:
          - payload:
              node_id: 37
  networkFactoryReset:
    address: zpc/{homeId}/Network/FactoryReset
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      empty:
        payload:
          schema:
            type: object
            additionalProperties: true
        examples:
          - payload: {}
  networkFactoryResetReport:
    address: zpc/Network/FactoryReset/Report
    x-doc-group: network
    description: Global topic (no home_id segment), like Discovery/Report.
    messages:
      factoryResetReport:
        payload:
          schema:
            type: object
            properties:
              status:
                type: string
              home_id:
                type: string
            additionalProperties: true
            example:
              status: ready
              home_id: AABBCCDD
        examples:
          - payload:
              home_id: F858F0B8
              status: ready
  networkNlsEnable:
    address: zpc/{homeId}/Network/NLS/Enable
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nlsEnable:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
            additionalProperties: true
        examples:
          - payload:
              node_id: 2
  networkNlsEnableReport:
    address: zpc/{homeId}/Network/NLS/Enable/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nlsEnableReport:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
              status:
                type: string
            additionalProperties: true
        examples:
          - payload:
              node_id: 2
              status: ok
  networkNlsState:
    address: zpc/{homeId}/Network/NLS/State
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nlsState:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
            additionalProperties: true
        examples:
          - payload:
              node_id: 2
  networkNlsStateReport:
    address: zpc/{homeId}/Network/NLS/State/Report
    x-doc-group: network
    parameters:
      homeId:
        $ref: "#/components/parameters/homeId"
    messages:
      nlsStateReport:
        payload:
          schema:
            type: object
            properties:
              node_id:
                type: integer
              nls_support:
                type: boolean
              nls_state:
                type: boolean
              status:
                type: string
            additionalProperties: true
        examples:
          - payload:
              node_id: 2
              nls_support: true
              nls_state: false
              status: ok
operations:
  receiveNetworkNodeAdd:
    action: receive
    title: NETWORK_NODE_ADD
    description: Start inclusion.
    channel:
      $ref: "#/channels/networkNodeAdd"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNodeAddReport:
    action: send
    title: NETWORK_NODE_ADD_REPORT
    description: |
      Success includes `node_id` and optional `dsk`. Fail may be immediate rejection
      (`reason` 6401 busy / 6402 reset) or security fail (`reason` 6404).
      Status is `"success"` or `"fail"`.
    channel:
      $ref: "#/channels/networkNodeAddReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeAddAbort:
    action: receive
    title: NETWORK_NODE_ADD_ABORT
    description: Abort ongoing inclusion. No report is published.
    channel:
      $ref: "#/channels/networkNodeAddAbort"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeRemove:
    action: receive
    title: NETWORK_NODE_REMOVE
    description: Start exclusion.
    channel:
      $ref: "#/channels/networkNodeRemove"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNodeRemoveReport:
    action: send
    title: NETWORK_NODE_REMOVE_REPORT
    description: Also fired on successful Remove Failed. `dsk` omitted if unavailable.
    channel:
      $ref: "#/channels/networkNodeRemoveReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeRemoveFailed:
    action: receive
    title: NETWORK_NODE_REMOVE_FAILED
    description: Remove a node believed failed. Controller NOP-probes first.
    channel:
      $ref: "#/channels/networkNodeRemoveFailed"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNodeRemoveFailedReport:
    action: send
    title: NETWORK_NODE_REMOVE_FAILED_REPORT
    description: |
      `ok` / `fail` with `reason` (`operation_successful`, `node_online`, …).
      On success, Remove/Report is also published.
    channel:
      $ref: "#/channels/networkNodeRemoveFailedReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeRemoveAbort:
    action: receive
    title: NETWORK_NODE_REMOVE_ABORT
    description: Abort ongoing exclusion. No report is published.
    channel:
      $ref: "#/channels/networkNodeRemoveAbort"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkDskAccept:
    action: receive
    title: NETWORK_DSK_ACCEPT
    description: Accept DSK during classic S2 inclusion. Not used for SmartStart.
    channel:
      $ref: "#/channels/networkDskAccept"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkRequestedKeysReport:
    action: send
    title: NETWORK_REQUESTED_KEYS_REPORT
    description: Keys requested during classic S2 inclusion. Not published for SmartStart.
    channel:
      $ref: "#/channels/networkRequestedKeysReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkGrantKeys:
    action: receive
    title: NETWORK_GRANT_KEYS
    description: Grant keys during classic S2 inclusion. Not used for SmartStart.
    channel:
      $ref: "#/channels/networkGrantKeys"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkRequestedDskReport:
    action: send
    title: NETWORK_REQUESTED_DSK_REPORT
    description: DSK verification needed during classic S2 inclusion.
    channel:
      $ref: "#/channels/networkRequestedDskReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeList:
    action: receive
    title: NETWORK_NODE_LIST
    description: Request node list.
    channel:
      $ref: "#/channels/networkNodeList"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNodeListReport:
    action: send
    title: NETWORK_NODE_LIST_REPORT
    description: Array of nodes with `node_information` and `version_report`.
    channel:
      $ref: "#/channels/networkNodeListReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeProperties:
    action: receive
    title: NETWORK_NODE_PROPERTIES
    description: Request node properties.
    channel:
      $ref: "#/channels/networkNodeProperties"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNodePropertiesReport:
    action: send
    title: NETWORK_NODE_PROPERTIES_REPORT
    description: Node properties; missing attribute-store values are `null`.
    channel:
      $ref: "#/channels/networkNodePropertiesReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNodeInterview:
    action: receive
    title: NETWORK_NODE_INTERVIEW
    description: |
      Request a (re-)interview for `node_id`. Completion is published on
      `Interview/Report`, not under this topic.
    channel:
      $ref: "#/channels/networkNodeInterview"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkFactoryReset:
    action: receive
    title: NETWORK_FACTORY_RESET
    description: Factory reset the controller.
    channel:
      $ref: "#/channels/networkFactoryReset"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkFactoryResetReport:
    action: send
    title: NETWORK_FACTORY_RESET_REPORT
    description: |
      Global topic. Published once when the controller is ready on the new network.
      Not retained.
    channel:
      $ref: "#/channels/networkFactoryResetReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNlsEnable:
    action: receive
    title: NETWORK_NLS_ENABLE
    description: Enable NLS for a node.
    channel:
      $ref: "#/channels/networkNlsEnable"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNlsEnableReport:
    action: send
    title: NETWORK_NLS_ENABLE_REPORT
    description: NLS enable result.
    channel:
      $ref: "#/channels/networkNlsEnableReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveNetworkNlsState:
    action: receive
    title: NETWORK_NLS_STATE
    description: Request NLS state.
    channel:
      $ref: "#/channels/networkNlsState"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendNetworkNlsStateReport:
    action: send
    title: NETWORK_NLS_STATE_REPORT
    description: NLS state report.
    channel:
      $ref: "#/channels/networkNlsStateReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
