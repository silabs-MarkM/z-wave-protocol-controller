operations:
  receiveSmartStartUpdate:
    action: receive
    title: NETWORK_SMARTSTART_UPDATE
    description: |
      Replaces ZPC's entire SmartStart provisioning list with the entries in the payload.
      Not incremental. For incremental changes use Add, Remove, or Clear.
    channel:
      $ref: "#/channels/smartStartUpdate"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveSmartStartAdd:
    action: receive
    title: NETWORK_SMARTSTART_ADD
    description: |
      Appends entries. Existing DSKs are skipped. No dedicated report topic;
      observe the list via List.
    channel:
      $ref: "#/channels/smartStartAdd"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveSmartStartRemove:
    action: receive
    title: NETWORK_SMARTSTART_REMOVE
    description: |
      Removes entries identified by DSK. Only the DSK field is read.
      Unknown DSKs are skipped. No dedicated report topic.
    channel:
      $ref: "#/channels/smartStartRemove"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveSmartStartClear:
    action: receive
    title: NETWORK_SMARTSTART_CLEAR
    description: Purges the entire list. Payload ignored.
    channel:
      $ref: "#/channels/smartStartClear"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  receiveSmartStartList:
    action: receive
    title: NETWORK_SMARTSTART_LIST
    description: Request the current SmartStart list. Payload ignored.
    channel:
      $ref: "#/channels/smartStartList"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
  sendSmartStartListReport:
    action: send
    title: NETWORK_SMARTSTART_LIST_REPORT
    description: Current provisioning list (`value` array, same shape as Update).
    channel:
      $ref: "#/channels/smartStartListReport"
    traits:
      - $ref: "#/components/operationTraits/mqttQos0"
components:
  messages:
    smartStartProvisioningList:
      name: SmartStart provisioning list
      payload:
        schema:
          type: object
          properties:
            value:
              type: array
              items:
                type: object
                properties:
                  DSK:
                    type: string
                  PreferredProtocols:
                    type: array
                    items:
                      type: string
                additionalProperties: true
          additionalProperties: true
          example:
            value:
              - DSK: "06743-56104-10648-10659-64918-00784-01021-46920"
                PreferredProtocols:
                  - Z-Wave
      examples:
        - payload:
            value:
              - DSK: "24387-01575-31185-49112-09809-35772-19872-53233"
                PreferredProtocols:
                  - Z-Wave
